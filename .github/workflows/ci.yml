name: PR CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: os-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Override this repository variable only with a tested, full root commit SHA.
  DIOPTASE_STACK_REF: ${{ vars.DIOPTASE_STACK_REF || '20a493b87692552881c1712779a0800fac72d34b' }}

jobs:
  tests:
    name: OS smoke suite
    runs-on: ubuntu-24.04
    # Five repetitions should remain far below GitHub's six-hour hosted limit.
    timeout-minutes: 330
    env:
      DIOPTASE_OS_TEST_RUNS: "5"
      DIOPTASE_OS_PARALLEL_JOBS: "4"
    steps:
      - name: Require an immutable stack revision
        run: |
          if [[ ! "$DIOPTASE_STACK_REF" =~ ^[0-9a-f]{40}$ ]]; then
            echo "OS CI: DIOPTASE_STACK_REF must be a full root repository commit SHA; observed '$DIOPTASE_STACK_REF'." >&2
            exit 1
          fi
      - name: Check out pinned Dioptase stack
        uses: actions/checkout@v7
        with:
          repository: b-Rocks2718/Dioptase
          ref: ${{ env.DIOPTASE_STACK_REF }}
          persist-credentials: false
      - name: Initialize pinned OS dependencies
        run: |
          git -c url."https://github.com/".insteadOf="git@github.com:" \
            submodule update --init --depth 1 -- \
            Dioptase-Assembler \
            Dioptase-Emulators/Dioptase-Emulator-Full \
            Dioptase-Languages/Dioptase-C-Compiler
      - name: Check out OS pull request
        uses: actions/checkout@v7
        with:
          path: Dioptase-OS
          persist-credentials: false
      - name: Install ext2 image tools
        run: |
          if ! command -v mkfs.ext2 >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes e2fsprogs
          fi
      - name: Run OS smoke suite
        run: bash Dioptase-OS/.github/scripts/ci.sh
      - name: Upload failure outputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: os-ci-failure-outputs
          if-no-files-found: ignore
          # Failure outputs are diagnostic scratch data, not release artifacts.
          retention-days: 7
          path: |
            Dioptase-OS/tests/*.raw
            Dioptase-OS/tests/*.out
            Dioptase-OS/tests/*.out.dir/**
            Dioptase-OS/build/*.labels
